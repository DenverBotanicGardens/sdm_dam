<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Galleries</title>
  <style>
    :root {
      --bg: #fafbf8;
      --ink: #1e2a22;
      --muted: #5d6b60;
      --line: #dce3da;
      --accent: #3f6b4a;
      --hover: #eef2ec;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141a16;
        --ink: #e6ece5;
        --muted: #9aa89c;
        --line: #2c362f;
        --accent: #8fbf98;
        --hover: #1d2520;
        color-scheme: dark;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 2rem clamp(1rem, 4vw, 3rem) 3rem;
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      align-items: end;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    h1 { margin: 0; font-size: clamp(1.6rem, 3vw, 2.2rem); font-weight: 650; letter-spacing: -0.01em; }
    .meta { margin: .25rem 0 0; color: var(--muted); font-size: .9rem; }
    input[type="search"] {
      width: min(320px, 100%);
      padding: .55rem .75rem;
      font: inherit;
      color: var(--ink);
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 6px;
    }
    input[type="search"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    .list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      grid-auto-rows: 1fr; /* every row as tall as the tallest tile, so all tiles match */
      gap: .75rem;
    }
    .list li { display: flex; min-width: 0; }
    .list a, .list .plain {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: .75rem;
      min-height: 6.5rem;
      padding: .9rem 1rem;
      color: inherit;
      text-decoration: none;
      background: var(--bg);
      border: 1px solid var(--line);
      border-left: 3px solid var(--accent);
      border-radius: 4px;
    }
    .list a:hover { background: var(--hover); }
    .list a:hover .name { color: var(--accent); }
    .list a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .name {
      font-weight: 600;
      line-height: 1.3;
      overflow-wrap: anywhere;
      display: -webkit-box;
      -webkit-line-clamp: 4; /* very long titles are trimmed; the full title shows on hover */
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .count { color: var(--muted); font-size: .85rem; font-variant-numeric: tabular-nums; }
    .empty { color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <div>
      <h1 id="page-title">Galleries</h1>
      <p class="meta" id="meta"></p>
    </div>
    <input id="q" type="search" placeholder="Find a gallery" aria-label="Find a gallery" />
  </header>
  <ul class="list" id="list"></ul>
  <p class="empty" id="empty" hidden></p>

  <script>
    async function main() {
      const res = await fetch('./galleries.json', { cache: 'no-store' });
      if (!res.ok) throw new Error('The gallery list could not be loaded. Run the Refresh workflow and try again.');
      const data = await res.json();
      const galleries = data.galleries || [];

      if (data.title) {
        document.getElementById('page-title').textContent = data.title;
        document.title = data.title;
      }
      const list = document.getElementById('list');
      const meta = document.getElementById('meta');
      const empty = document.getElementById('empty');
      const q = document.getElementById('q');
      const updated = data.updated_at
        ? new Date(data.updated_at).toLocaleDateString(undefined, { dateStyle: 'medium' })
        : null;

      function render(filterText = '') {
        const f = filterText.trim().toLowerCase();
        const shown = galleries.filter(g => g.title.toLowerCase().includes(f));
        list.replaceChildren(...shown.map(g => {
          const li = document.createElement('li');
          const row = document.createElement(g.url ? 'a' : 'div');
          if (g.url) {
            row.href = g.url;
            row.target = '_top'; // open the portal in the full window when embedded
          } else {
            row.className = 'plain';
          }
          const name = document.createElement('span');
          name.className = 'name';
          name.textContent = g.title;
          row.title = g.title;
          const count = document.createElement('span');
          count.className = 'count';
          count.textContent = `${g.count} ${g.count === 1 ? 'asset' : 'assets'}`;
          row.append(name, count);
          li.appendChild(row);
          return li;
        }));
        meta.textContent = `${galleries.length} ${galleries.length === 1 ? 'gallery' : 'galleries'}` +
          (updated ? `, updated ${updated}` : '');
        empty.hidden = shown.length > 0;
        empty.textContent = galleries.length
          ? `No galleries match “${filterText.trim()}”.`
          : 'No galleries yet. Tag assets in NetX and they will appear here after the next refresh.';
      }

      q.addEventListener('input', () => render(q.value));
      render();
    }

    main().catch(err => {
      const p = document.getElementById('empty');
      p.hidden = false;
      p.textContent = err.message;
    });
  </script>
</body>
</html>
